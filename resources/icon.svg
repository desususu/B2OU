<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Warm amber-to-orange gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E8750A"/>
    </linearGradient>
  </defs>

  <!-- Background: full-bleed warm gradient (system applies rounded masking) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Bear face — white, centered, simplified -->

  <!-- Left ear -->
  <circle cx="340" cy="300" r="110" fill="#FFFFFF"/>

  <!-- Right ear -->
  <circle cx="684" cy="300" r="110" fill="#FFFFFF"/>

  <!-- Head -->
  <ellipse cx="512" cy="480" rx="230" ry="210" fill="#FFFFFF"/>

  <!-- Left eye -->
  <circle cx="430" cy="440" r="32" fill="#E8750A"/>

  <!-- Right eye -->
  <circle cx="594" cy="440" r="32" fill="#E8750A"/>

  <!-- Nose -->
  <ellipse cx="512" cy="520" rx="35" ry="26" fill="#E8750A"/>

  <!-- Export arrow — upward arrow below the bear, on orange background -->
  <g transform="translate(512, 800)">
    <!-- Arrow shaft -->
    <rect x="-14" y="-50" width="28" height="75" rx="14" fill="#FFFFFF" opacity="0.9"/>
    <!-- Arrow head -->
    <polygon points="0,-90 48,-40 -48,-40" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
